<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commissariaat Wanica Centrum - Messenger & Beheer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDocs, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5IZosJ-nR9tZ8Mr6Ze59xIyPCLSyBrbo",
            authDomain: "wanicacentrum-messenger.firebaseapp.com",
            projectId: "wanicacentrum-messenger",
            storageBucket: "wanicacentrum-messenger.appspot.com",
            messagingSenderId: "823531744978",
            appId: "1:823531744978:web:73d9e36bd426c75636470b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.addDoc = addDoc;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.collection = collection;
        window.query = query;
        window.orderBy = orderBy;
        window.onSnapshot = onSnapshot;
        window.serverTimestamp = serverTimestamp;

        window.addEventListener('DOMContentLoaded', async () => {
            const select = document.getElementById('login-username');
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                querySnapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const opt = document.createElement('option');
                    opt.value = docSnapshot.id;
                    opt.textContent = `${data.dept} (${docSnapshot.id})`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Fout bij laden gebruikers:", err);
            }
        });
    </script>
    <style>
        .transparent-logo {
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans">
    <!-- Header -->
    <header class="bg-emerald-800 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="bg-white rounded-full p-1 shadow h-11 w-11 flex items-center justify-center overflow-hidden">
                <img src="logo.png" alt="Logo Wanica Centrum" class="h-full w-full object-contain transparent-logo">
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight">Commissariaat Wanica Centrum</h1>
                <p class="text-xs text-emerald-200">Interne Afdelingscommunicatie</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="user-info" class="text-sm bg-emerald-700 px-3 py-1 rounded hidden font-medium"></div>
            <button id="logout-btn" onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded hidden transition">Uitloggen</button>
        </div>
    </header>

    <!-- Login Scherm -->
    <div id="login-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border-t-4 border-emerald-600">
            <div class="flex flex-col items-center mb-4">
                <div class="w-52 h-52 mb-2 flex items-center justify-center">
                    <img src="logo.png" alt="Districtscommissariaat Wanica Centrum" class="w-full h-full object-contain transparent-logo">
                </div>
                <h2 class="text-xl font-bold text-slate-800 text-center">Inloggen Wanica Messenger</h2>
                <p class="text-xs text-slate-500 text-center">Selecteer uw afdeling of beheerder.</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Selecteer Gebruiker / Afdeling</label>
                    <select id="login-username" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm bg-white" required>
                        <option value="">-- Kies uw afdeling of beheerder --</option>
                        <option value="admin">Administrator (Beheer)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Wachtwoord</label>
                    <input type="password" id="login-password" placeholder="Voer uw wachtwoord in" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm" required>
                </div>
                <button type="submit" class="w-full bg-emerald-700 text-white p-3 rounded-lg font-semibold hover:bg-emerald-800 transition text-sm">Inloggen</button>
            </form>
        </div>
    </div>

    <!-- Hoofdscherm -->
    <div id="main-screen" class="flex-1 flex flex-col hidden overflow-hidden">
        <!-- Admin Paneel -->
        <div id="admin-panel" class="bg-slate-800 text-white p-4 shadow-md hidden">
            <div class="max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-emerald-400 text-sm flex items-center gap-2">
                        ⚙️ Beheerderspaneel (Gebruikersbeheer)
                    </h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <form id="create-user-form" class="bg-slate-700 p-3 rounded-lg space-y-2 text-xs">
                        <span class="font-semibold text-slate-200 block mb-1">Nieuwe Gebruiker Toevoegen</span>
                        <input type="text" id="new-user-id" placeholder="Inlognaam (bijv. burgerzaken)" class="w-full p-2 rounded bg-slate-600 border border-slate-500 text-white" required>
                        <input type="text" id="new-user-dept" placeholder="Afdeling (bijv. Hoofd Burgerzaken)" class="w-full p-2 rounded bg-slate-600 border border-slate-500 text-white" required>
                        <input type="password" id="new-user-pass" placeholder="Wachtwoord" class="w-full p-2 rounded bg-slate-600 border border-slate-500 text-white" required>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 p-2 rounded font-semibold text-white">Gebruiker Opslaan</button>
                    </form>
                    <div class="bg-slate-700 p-3 rounded-lg text-xs flex flex-col">
                        <span class="font-semibold text-slate-200 mb-2 block">Geregistreerde Gebruikers</span>
                        <div id="users-list" class="flex-1 overflow-y-auto max-h-36 space-y-1 pr-1"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="messages-container"></div>

        <div class="bg-white border-t p-4 shadow-lg">
            <form id="chat-form" class="flex gap-2 items-center max-w-4xl mx-auto">
                <input type="text" id="message-input" placeholder="Typ een bericht voor alle afdelingshoofden..." class="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-emerald-500 text-sm">
                <button type="submit" class="bg-emerald-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-800 transition text-sm">Verstuur</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if (!username) { alert('Selecteer a.u.b. een gebruiker.'); return; }

            if (username === 'admin' && pass === 'admin123') {
                currentUser = { name: 'Administrator', dept: 'Systeembeheer', role: 'admin' };
                setupApp();
                return;
            }

            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "users"));
                let foundUser = null;
                querySnapshot.forEach((doc) => {
                    if (doc.id === username && doc.data().password === pass) {
                        foundUser = doc.data();
                        foundUser.id = doc.id;
                    }
                });

                if (foundUser) {
                    currentUser = { name: foundUser.dept, dept: foundUser.dept, role: 'user' };
                    setupApp();
                } else {
                    alert('Onjuist wachtwoord of selectie!');
                }
            } catch (err) {
                console.error("Inlogfout:", err);
                alert("Fout bij inloggen.");
            }
        });

        function setupApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('user-info').textContent = currentUser.name;
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');

            if (currentUser.role === 'admin') {
                document.getElementById('admin-panel').classList.remove('hidden');
                loadUsersList();
            }
            loadMessages();
        }

        function logout() { location.reload(); }
        window.logout = logout;

        document.getElementById('create-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('new-user-id').value.trim();
            const dept = document.getElementById('new-user-dept').value.trim();
            const pass = document.getElementById('new-user-pass').value.trim();

            try {
                await window.setDoc(window.doc(window.db, "users", userId), { dept, password: pass });
                alert(`Gebruiker '${userId}' opgeslagen! Vernieuw de pagina om te zien in de lijst.`);
                document.getElementById('create-user-form').reset();
                loadUsersList();
            } catch (err) {
                alert("Kon gebruiker niet opslaan.");
            }
        });

        async function loadUsersList() {
            const listDiv = document.getElementById('users-list');
            listDiv.innerHTML = '<span class="text-slate-400">Laden...</span>';
            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "users"));
                listDiv.innerHTML = '';
                if(querySnapshot.empty) {
                    listDiv.innerHTML = '<span class="text-slate-400">Nog geen gebruikers.</span>';
                    return;
                }
                querySnapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    const uId = docSnapshot.id;
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center bg-slate-600 p-2 rounded text-xs';
                    item.innerHTML = `
                        <div>
                            <span class="font-bold text-emerald-300">${uId}</span> - <span class="text-slate-200">${data.dept}</span>
                            <span class="text-slate-400 text-[10px] block">Wachtwoord: ${data.password}</span>
                        </div>
                        <button onclick="deleteUser('${uId}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-[10px]">Verwijder</button>
                    `;
                    listDiv.appendChild(item);
                });
            } catch(err) { console.error(err); }
        }

        async function deleteUser(uId) {
            if(confirm(`Weet je zeker dat je '${uId}' wilt verwijderen?`)) {
                try {
                    await window.deleteDoc(window.doc(window.db, "users", uId));
                    loadUsersList();
                } catch(err) { alert("Fout bij verwijderen."); }
            }
        }
        window.deleteUser = deleteUser;

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if(!text || !currentUser) return;

            try {
                await window.addDoc(window.collection(window.db, "messages"), {
                    text,
                    senderName: currentUser.name,
                    senderDept: currentUser.dept,
                    timestamp: window.serverTimestamp()
                });
                input.value = '';
            } catch(err) { alert("Kon bericht niet versturen."); }
        });

        function loadMessages() {
            The q = window.query(window.collection(window.db, "messages"), window.orderBy("timestamp", "asc"));
            window.onSnapshot(q, (snapshot) => {
                const container = document.getElementById('messages-container');
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const isMe = currentUser && data.senderName === currentUser.name;
                    const div = document.createElement('div');
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    div.innerHTML = `
                        <div class="text-xs text-slate-500 mb-1 font-medium">${data.senderName}</div>
                        <div class="max-w-md p-3 rounded-xl shadow-sm text-sm ${isMe ? 'bg-emerald-700 text-white rounded-br-none' : 'bg-white text-slate-800 rounded-bl-none border'}">
                            ${data.text}
                        </div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }
    </script>
</body>
</html>
